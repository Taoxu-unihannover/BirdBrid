<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-labelledby="title desc">
  <title id="title">BirdBrid</title>
  <desc id="desc">彩色鹊鸟相向飞来，组成拱形鹊桥；桥下是清晰居中的 BirdBrid 字标。</desc>
  <defs>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e66e65"/><stop offset=".24" stop-color="#e9aa41"/>
      <stop offset=".49" stop-color="#46a781"/><stop offset=".74" stop-color="#3c9bbb"/><stop offset="1" stop-color="#8c6bbe"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#254b51"/><stop offset=".5" stop-color="#237e80"/><stop offset="1" stop-color="#66518c"/>
    </linearGradient>
    <g id="magpie">
      <path d="M-16 7 -5 0 Q-9-5-10-12 Q0-10 4-3 Q8-8 13-5 Q17-4 16 0 L21 2 15 3 Q11 10 2 7 L-13 14 -8 6Z" fill="currentColor"/>
      <path d="M-4-4 Q0-4 6 2 Q2 6-2 4Z" fill="#fff" opacity=".92"/>
