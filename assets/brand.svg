    </g>
  </defs>
  <path d="M19 32 Q125-10 231 32" fill="none" stroke="url(#bridge)" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 32 Q125 0 223 32" fill="none" stroke="url(#bridge)" stroke-width="1.3" opacity=".35"/>
  <use href="#magpie" transform="translate(67 17) rotate(-12) scale(.72)" color="#dd9150"/>
  <use href="#magpie" transform="translate(183 17) rotate(12) scale(-.72 .72)" color="#678fc0"/>
  <path d="m123 6 2-3 2 3-2 3Z" fill="#4ca987"/>
  <text x="125" y="58" text-anchor="middle" textLength="185" lengthAdjust="spacingAndGlyphs" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-.6" fill="url(#word)">BirdBrid</text>
</svg>
