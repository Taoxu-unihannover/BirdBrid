id: 06-inference
title: GR00T 推理服务
order: 6
category: sim2real
description: 配置属于你的工位服务，把观测转成策略动作。
duration: 30 分钟
guide: guides/06-inference.md
steps:
- title: 检查后端准备情况
  where: '{compute} · 推理容器 /workspace/deploy'
  note: 集中模式由教师维护共享后端；本机 GPU 模式先完成第 9 课，启动本机后端和推理容器。
- title: 部署工位前端壳
  where: '{compute} · 推理容器 /workspace/deploy'
  note: 前端壳和后端在同一推理主机、同一 host 网络；需要 GR00T MsgSerializer 和 zmq。
  command: /Isaac-GR00T/.venv/bin/python station_server.py {{station}} {{port}} tcp://127.0.0.1:{{backend}}
- title: 检查监听端口
  where: '{compute} · 宿主机'
  note: 这里只检查监听状态，真机调用结果在第 7 课确认。
  command: ss -lnt | grep -- {{port}}

prerequisite_courses: ["01-overview", "02-setup"]
recommended_courses: ["05-sim-teleop"]
prerequisite_note: 先理解任务并准备客户端环境；仿真遥操作有助于理解完整链路，但不是启动推理服务的必做步骤。教师须事先准备推理后端。
